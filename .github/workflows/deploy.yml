name: CI/CD FastCargo Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Test & Build Gate
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: FastCargo_test
          MYSQL_USER: fastcargo
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Map mysql service hostname
        run: echo "127.0.0.1 mysql" | sudo tee -a /etc/hosts

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, gd, bcmath, intl, zip, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare CI .env for testing
        run: |
          cp .env.example .env
          sed -i 's/^OPERATOR_IP_WHITELIST_ENABLED=true/OPERATOR_IP_WHITELIST_ENABLED=false/' .env

      - name: Run Laravel Pint check
        run: vendor/bin/pint app tests --test

      - name: Run PHPUnit test suite
        run: php artisan test --compact

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/payG/go.sum

      - name: Run Go PayG tests
        working-directory: services/payG
        run: go test ./...

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Vite assets & check JS syntax
        run: |
          npm install --no-save
          npm run build
          node --check public/assets/dashboard/js/jsQR.js
          node --check public/assets/dashboard/js/qris-decoder.js

  deploy:
    name: Deploy to Production VPS
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/fastcargo
            git fetch origin main
            git reset --hard origin/main
            bash deploy.sh

